<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Doğa Sıngın</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single reading column with a sticky tab bar; the Journey tab pairs a schematic route map with a stop-by-stop log */
:root {
  --bg: #F8FAF9; color-scheme: light; --surface: #FFFFFF; --ink: #14211C; --muted: #5B6B64; --line: #D7E0DB;
  --accent: #1E6A4E; --accent-soft: #E1EEE7; --route: #8FB5A3;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.hero { padding-block: 36px 22px; display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
.hero img { width: 128px; height: 158px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.hero h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 6vw, 44px); line-height: 1.05; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.role { margin-top: 8px; font-family: var(--mono); font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.contacts { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); text-decoration: none; cursor: pointer; font-family: var(--body); }
.chip:hover { border-color: var(--accent); }
.findme { margin-top: 10px; font-size: 14.5px; }
.findme b { color: var(--accent); }
.chip small { color: var(--muted); font-size: 11.5px; }
.chip.wa { background: #1FA855; border-color: #1FA855; color: #fff; font-weight: 600; }
.chip.wa:hover { background: #178F47; }
.chip.li { background: #0A66C2; border-color: #0A66C2; color: #fff; font-weight: 600; }
.chip.li:hover { background: #0857A6; }
.hello { display: inline-flex; align-items: baseline; gap: 8px; margin-bottom: 8px; padding: 5px 12px; border-radius: 999px; background: var(--accent-soft); border: 0; cursor: pointer; font: 600 14px var(--body); color: var(--accent); }
.hello small { font: 400 11px var(--mono); color: var(--muted); letter-spacing: .04em; }
.hello span { transition: opacity .25s; }
.hello:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabrow { display: flex; gap: 4px; overflow-x: auto; }
.tabrow button { font: 600 14.5px var(--body); color: var(--muted); background: none; border: 0; padding: 14px 14px 12px; border-bottom: 2.5px solid transparent; cursor: pointer; white-space: nowrap; }
.tabrow button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabrow button:focus-visible, .chip:focus-visible, .stop:focus-visible, .pin:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { padding-block: 26px 60px; }
h2 { font-family: var(--display); font-weight: 500; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 34px 0 12px; }
h2:first-child { margin-top: 0; }
.about { font-size: 16.5px; max-width: 66ch; }
.entry { display: grid; grid-template-columns: 150px 1fr; gap: 4px 20px; padding-block: 14px; border-top: 1px solid var(--line); }
.entry:first-of-type { border-top: 0; }
.when { font-family: var(--mono); font-size: 12.5px; color: var(--muted); padding-top: 3px; font-variant-numeric: tabular-nums; }
.entry h3 { margin: 0; font-size: 16px; font-weight: 600; }
.entry .where { color: var(--muted); font-size: 14px; }
.entry ul { margin: 6px 0 0; padding-left: 18px; }
.entry li { margin-bottom: 3px; }
.entry > div { min-width: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 13.5px; padding: 4px 10px; border-radius: 4px; background: var(--accent-soft); color: var(--ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }
.list { margin: 0; padding-left: 18px; }
.list li { margin-bottom: 4px; }
.dl { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--line); }
.dlbtn { display: inline-flex; align-items: center; font-weight: 600; font-size: 15px; color: #fff; background: var(--accent); text-decoration: none; padding: 12px 20px; border-radius: 6px; }
.dlbtn:hover { filter: brightness(1.1); }
.dlbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Journey */
.mapbox { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; }
.mapbox svg { display: block; width: 100%; min-width: 520px; height: auto; }
.grid-dot { fill: var(--line); }
.arc { fill: none; stroke: var(--route); stroke-width: 1.4; stroke-dasharray: 4 4; }
.pin { cursor: pointer; }
.pin circle.o { fill: var(--surface); stroke: var(--accent); stroke-width: 2; transition: r .15s; }
.pin circle.i { fill: var(--accent); }
.pin text { font: 600 12px var(--body); fill: var(--ink); }
.pin text.sub { font: 400 10.5px var(--mono); fill: var(--muted); }
.pin.on circle.o { fill: var(--accent); r: 11; }
.hint { color: var(--muted); font-size: 13.5px; margin: 10px 2px 0; }
.stops { margin-top: 18px; display: grid; gap: 10px; }
.stop { text-align: left; width: 100%; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; cursor: pointer; display: grid; grid-template-columns: 120px 1fr; gap: 4px 16px; }
.stop.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.stop .place { font-family: var(--display); font-weight: 700; font-size: 17px; }
.stop .yr { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.stop .detail { min-width: 0; }
.stop .detail ul { margin: 6px 0 0; padding-left: 18px; }
.stop:not(.on) .detail ul { display: none; }
.stop.on .detail .title { display: none; }
.stop .kind { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 600; }
.stop .title { font-weight: 600; }


/* Next trip */
.next { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line); display: grid; grid-template-columns: 76px 1fr; gap: 16px; align-items: center; }
.next > div { min-width: 0; }
.stamp.blank { --ink-c: var(--muted); --rot: -8deg; border-style: dashed; cursor: default; width: 76px; }
.stamp.blank::before { display: none; }
.nexttxt { margin: 0 0 10px !important; color: var(--ink) !important; font-size: 16px !important; font-weight: 500; }
.nextbtn { display: inline-flex; font-weight: 600; font-size: 14px; color: #fff; background: #1FA855; text-decoration: none; padding: 9px 14px; border-radius: 6px; }
.nextbtn:hover { background: #178F47; }
/* Passport stamps */
.tabrow button.globe { font-size: 20px; padding-inline: 12px; }
@keyframes stampIn { 0% { opacity: 0; transform: rotate(var(--rot)) scale(1.7); } 70% { opacity: 1; transform: rotate(var(--rot)) scale(.94); } 100% { opacity: .9; transform: rotate(var(--rot)) scale(1); } }
.stamps .stamp { animation: stampIn .38s ease-out both; animation-delay: calc(var(--i) * 70ms); }
@media (prefers-reduced-motion: reduce) { .stamps .stamp { animation: none; } }
.passport { margin-top: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px 16px; }
.passport h3 { margin: 0; font-family: var(--display); font-size: 20px; }
.passport p { margin: 4px 0 16px; color: var(--muted); font-size: 14px; }
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 14px 10px; }
.stamp { aspect-ratio: 1; max-width: 100%; border: 2px solid var(--ink-c); color: var(--ink-c); border-radius: 50%; display: grid; place-content: center; text-align: center; position: relative; transform: rotate(var(--rot)); opacity: .9; background: none; font: inherit; cursor: pointer; transition: transform .2s; }
.stamp::before { content: ""; position: absolute; inset: 4px; border: 1px dashed var(--ink-c); border-radius: 50%; }
.stamp.sq { border-radius: 8px; } .stamp.sq::before { border-radius: 5px; }
.stamp b { font: 700 22px var(--display); letter-spacing: .04em; line-height: 1; }
.stamp span { font: 500 9.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; padding-inline: 6px; }
.stamp:hover, .stamp:focus-visible { transform: rotate(0deg) scale(1.08); opacity: 1; outline: none; }
@media (prefers-reduced-motion: reduce) { .stamp { transition: none; } }
@media (max-width: 620px) {
  header.hero { grid-template-columns: 1fr; }
  .hero img { width: 112px; height: 138px; }
  .entry, .stop { grid-template-columns: 1fr; }
  .two { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

function entries(list) {
  return list.map(([w, t, where, b]) => `<div class="entry"><div class="when">${w}</div><div><h3>${esc(t)}</h3><div class="where">${esc(where)}</div>${b.length ? "<ul>" + b.map(x => `<li>${esc(x)}</li>`).join("") + "</ul>" : ""}</div></div>`).join("");
}

function cv(L) {
  const d = T[L];
  return `<h2>${d.h.about}</h2><p class="about">${esc(d.about)}</p>
  <h2>${d.h.exp}</h2>${entries(d.exp)}
  <h2>${d.h.climate}</h2>${entries(d.climate)}
  <h2>${d.h.edu}</h2>${entries(d.edu)}
  <div class="two"><div><h2>${d.h.skills}</h2><div class="tags">${d.skills.map(s => `<span class="tag">${esc(s)}</span>`).join("")}</div>
  <h2>${d.h.lang}</h2><ul class="list">${d.lang.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
  <h2>${d.h.beyond}</h2><div class="tags">${d.beyond.map(s => `<span class="tag">${esc(s)}</span>`).join("")}</div></div>
  <div><h2>${d.h.cert}</h2><ul class="list">${d.cert.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div></div>
  <div class="dl"><a class="dlbtn" href="doga-singin-cv-${L}.pdf" target="_blank" rel="noopener">${d.pdf}</a></div>`;
}

function proj(lon, lat) { // equirectangular over lon -2..74, lat 34..53
  return [20 + (lon + 2) / 76 * 660, 20 + (53 - lat) / 19 * 260];
}

function journey(L) {
  const d = T[L];
  let dots = "";
  for (let x = 30; x < 700; x += 18) for (let y = 26; y < 300; y += 18) dots += `<circle class="grid-dot" cx="${x}" cy="${y}" r="1.1"/>`;
  const [hx, hy] = proj(28.98, 41.01);
  const arcs = STOPS.filter(s => s.id !== "istanbul").map(s => { const [x, y] = proj(s.lon, s.lat); const mx = (hx + x) / 2, my = Math.min(hy, y) - 40; return `<path class="arc" d="M${hx},${hy} Q${mx},${my} ${x},${y}"/>`; }).join("");
  const pins = STOPS.map(s => { const [x, y] = proj(s.lon, s.lat); const below = s.id === "cop31"; return `<g class="pin${s.id === active ? " on" : ""}" data-id="${s.id}" tabindex="0" role="button" aria-label="${s[L].place}"><circle class="o" cx="${x}" cy="${y}" r="8"/><circle class="i" cx="${x}" cy="${y}" r="3"/><text x="${x + 13}" y="${below ? y + 18 : y - 4}">${s[L].place}</text><text class="sub" x="${x + 13}" y="${below ? y + 31 : y + 10}">${s.yr[L]}</text></g>`; }).join("");
  const cards = STOPS.map(s => `<button class="stop${s.id === active ? " on" : ""}" data-id="${s.id}" id="stop-${s.id}"><div><div class="place">${s[L].place}</div><div class="yr">${s.yr[L]}</div></div><div class="detail"><div class="title">${esc(s[L].items[0][1])}${s[L].items.length > 1 ? ` <span class="yr">+${s[L].items.length - 1}</span>` : ""}</div><ul>${s[L].items.map(([k, v]) => `<li><span class="kind">${k}</span> · ${esc(v)}</li>`).join("")}</ul></div></button>`).join("");
  return `<div class="mapbox"><svg viewBox="0 0 720 300" role="img" aria-label="${d.journeyTab}">${dots}${arcs}${pins}</svg></div><p class="hint">${d.hint}</p><div class="stops">${cards}</div>`;
}

const INKS = ["#1E6A4E", "#2B5DA8", "#B0413E", "#6B4FA0", "#9A6A12"];
function passport(L) {
  const head = L === "tr" ? ["Pasaport damgaları", `${COUNTRIES.length} ülke, sayı artmaya devam ediyor.`] : ["Passport stamps", `${COUNTRIES.length} countries and counting.`];
  const st = COUNTRIES.map(([c, en, tr], i) => {
    const rot = ((i * 37) % 21) - 10, sq = i % 3 === 1 ? " sq" : "";
    return `<button class="stamp${sq}" style="--ink-c:${INKS[i % INKS.length]};--rot:${rot}deg;--i:${i}" title="${L === "tr" ? tr : en}"><b>${c}</b><span>${L === "tr" ? tr : en}</span></button>`;
  }).join("");
  const msg = L === "tr" ? "Merhaba Doğa! Bir sonraki yolculuğun şuraya olmalı: " : "Hi Doğa! Your next trip should be to: ";
  const btn = L === "tr" ? "WhatsApp'tan bir ülke öner" : "Suggest a country on WhatsApp";
  const nl = L === "tr" || L === "en" ? (NL === "tr" || NL === "en" ? NEXT[L] : NEXT[NL]) : NEXT[L];
  return `<section class="passport"><h3>${head[0]}</h3><p>${head[1]}</p><div class="stamps">${st}</div>
  <div class="next"><div class="stamp blank" aria-hidden="true"><b>?</b></div><div><p class="nexttxt" dir="${NL === "ar" && nl === NEXT.ar ? "rtl" : "auto"}">${esc(nl)}</p>
  <a class="nextbtn" href="https://wa.me/905325900779?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${btn} ↗</a></div></div></section>`;
}
function render() {
  const d = T[lang];
  $("#role").textContent = d.role;
  $("#findme").innerHTML = d.findme;
  $("#t-journey").textContent = lang === "tr" ? "Yolculuk" : "Journey";
  document.querySelectorAll(".copy small").forEach(s => s.textContent = d.copy);
  document.querySelectorAll(".tabrow button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  document.documentElement.lang = lang;
  $("#main").innerHTML = view === "journey" ? journey(lang) : view === "passport" ? passport(lang) : cv(view);
}

function select(id) {
  active = id;
  document.querySelectorAll(".pin, .stop").forEach(el => el.classList.toggle("on", el.dataset.id === id));
}

function fromHash() {
  const h = location.hash.slice(1);
  if (h === "tr" || h === "en") { view = h; lang = h; }
  else if (h === "journey" || h === "yolculuk") { view = "journey"; if (h === "yolculuk") lang = "tr"; }
  else if (h === "passport" || h === "pasaport") { view = "passport"; if (h === "pasaport") lang = "tr"; }
  else { view = DEF; lang = DEF; }
  render();
}

document.querySelector(".tabrow").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const v = b.dataset.view;
  if (v === "journey") location.hash = lang === "tr" ? "yolculuk" : "journey"; else if (v === "passport") location.hash = lang === "tr" ? "pasaport" : "passport"; else location.hash = v;
});
$("#main").addEventListener("click", e => {
  const el = e.target.closest(".pin, .stop"); if (!el) return;
  select(el.dataset.id);
  if (el.classList.contains("pin")) { const c = document.getElementById("stop-" + el.dataset.id); if (c) c.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
});
$("#main").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.closest(".pin")) { e.preventDefault(); select(e.target.closest(".pin").dataset.id); } });
document.querySelectorAll(".copy").forEach(b => b.addEventListener("click", () => {
  const s = b.querySelector("small");
  const done = () => { s.textContent = T[lang].copied; setTimeout(() => s.textContent = T[lang].copy, 1500); };
  try { navigator.clipboard.writeText(b.dataset.v).then(done, () => {}); } catch (_) {}
}));
window.addEventListener("hashchange", fromHash);
fromHash();

const HELLO = [
  ["en","Nice to meet you!"],["tr","Tanıştığımıza memnun oldum!"],["fr","Enchantée !"],["es","¡Encantada de conocerte!"],
  ["it","Piacere di conoscerti!"],["de","Schön, Sie kennenzulernen!"],["pt","Prazer em conhecer você!"],["sq","Gëzohem që u njohëm!"],

];
let hi = 0;
try { const prefs = (navigator.languages || [navigator.language || "en"]).map(l => l.slice(0, 2).toLowerCase());
  for (const p of prefs) { const k = HELLO.findIndex(h => h[0] === p); if (k >= 0) { hi = k; break; } } } catch (_) {}
function showHello() { $("#hello-t").textContent = HELLO[hi][1]; $("#hello-t").dir = HELLO[hi][0] === "ar" ? "rtl" : "auto"; $("#hello-l").textContent = HELLO[hi][0].toUpperCase(); }
showHello();
$("#hello").addEventListener("click", () => { hi = (hi + 1) % HELLO.length; showHello(); });
</script>
